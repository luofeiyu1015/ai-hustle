{% extends "base.html" %}
{% block title %}{% if product %}编辑{% else %}新建{% endif %}产品 - AI副业助手{% endblock %}
{% block content %}

<div style="padding: 12px 16px; display: flex; align-items: center; gap: 10px;">
    <a href="{{ url_for('products_list') }}" style="font-size: 20px;">←</a>
    <h2 style="font-size: 16px;">{% if product %}编辑产品{% else %}新建产品{% endif %}</h2>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">产品名称 <span class="required">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required placeholder="如：AI绘画Prompt包·治愈系 50组">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">产品分类</label>
                <select name="category" class="form-control">
                    {% for key, cat in product_categories.items() %}
                        <option value="{{ key }}" {% if product and product.category == key %}selected{% endif %}>{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">封面Emoji</label>
                <input type="text" name="cover_emoji" class="form-control" value="{{ product.cover_emoji if product else '📦' }}" maxlength="4">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">售价（元）</label>
                <input type="number" name="price" class="form-control" step="0.1" value="{{ product.price if product else '9.9' }}">
            </div>
            <div class="form-group">
                <label class="form-label">状态</label>
                <select name="status" class="form-control">
                    <option value="active" {% if product and product.status == 'active' %}selected{% endif %}>在售</option>
                    <option value="draft" {% if product and product.status == 'draft' %}selected{% endif %}>草稿</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">简短描述</label>
            <input type="text" name="description" class="form-control" value="{{ product.description if product else '' }}" placeholder="一句话描述你的产品">
        </div>

        <div class="form-group">
            <label class="form-label">详细内容/卖点</label>
            <textarea name="content" class="form-control" rows="8" placeholder="写清楚产品包含什么、适合谁、怎么用...">{{ product.content if product else '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label">标签（逗号分隔）</label>
            <input type="text" name="tags" class="form-control" value="{{ product.tags if product else '' }}" placeholder="AI绘画,Prompt,Midjourney">
        </div>

        <div class="form-group">
            <label class="form-label">上架平台（逗号分隔）</label>
            <select name="platforms" class="form-control">
                <option value="闲鱼,小红书" {% if product and product.platforms == '闲鱼,小红书' %}selected{% endif %}>闲鱼 + 小红书</option>
                <option value="闲鱼" {% if product and product.platforms == '闲鱼' %}selected{% endif %}>仅闲鱼</option>
                <option value="小红书" {% if product and product.platforms == '小红书' %}selected{% endif %}>仅小红书</option>
                <option value="闲鱼,淘宝" {% if product and product.platforms == '闲鱼,淘宝' %}selected{% endif %}>闲鱼 + 淘宝</option>
            </select>
        </div>

        <div class="btn-group">
            <a href="{{ url_for('products_list') }}" class="btn btn-outline btn-block" style="flex: 1;">取消</a>
            <button type="submit" class="btn btn-primary btn-block" style="flex: 2;">💾 保存</button>
        </div>
    </form>
</div>

{% endblock %}
